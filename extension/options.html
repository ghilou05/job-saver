<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="options.css" />
</head>

<body>
  <div class="wrapper">
    <div class="header">
      <svg class="bookmark-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 3.5C6 2.67157 6.67157 2 7.5 2H16.5C17.3284 2 18 2.67157 18 3.5V21L12 17L6 21V3.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <h3>Job Saver</h3>
      <span class="crumb">/ Settings</span>
    </div>

    <div class="section">
      <div class="section-label">Connected workspace</div>
      <button id="loginWithNotion">Log in with Notion</button>
      <div id="loginStatus"></div>
      <div id="connections"></div>
      <div id="browser"></div>
    </div>

    <div class="section">
      <div class="section-label">Active destinations</div>
      <div id="list"></div>
    </div>

    <hr />

    <div class="section">
      <h4>Add a new destination</h4>

      <div class="field">
        <label>Label (shown in the popup dropdown)</label>
        <input id="newLabel" placeholder="e.g. Summer Internships" />
      </div>

      <details class="advanced">
        <summary>Advanced: paste integration token &amp; database ID manually</summary>

        <div class="field">
          <label>Integration Token</label>
          <input id="newToken" placeholder="secret_..." />
        </div>

        <div class="field">
          <label>Database ID</label>
          <input id="newDbId" />
        </div>
      </details>

      <button id="add">Add destination</button>
      <div id="status"></div>
    </div>
  </div>

  <script src="options.js"></script>
</body>

</html>
