<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <div class="wrapper">
    <div class="header">
      <div class="header-left">
        <svg class="bookmark-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 3.5C6 2.67157 6.67157 2 7.5 2H16.5C17.3284 2 18 2.67157 18 3.5V21L12 17L6 21V3.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
        <h3>Job Saver</h3>
      </div>
      <p class="save-link">Save this job</p>
    </div>

    <div class="database-selection">
      <label>Save to</label>
      <div id="destinations"></div>
    </div>

    <div class="field">
      <div class="field-label">
        <label>Job title</label>
      </div>
      <input id="jobTitle" />
    </div>

    <div class="field">
      <label>Company</label>
      <input id="company" placeholder="e.g. Anthropic" />
    </div>

    <div class="field">
      <div class="field-label">
        <label>Link</label>
      </div>
      <input id="url" />
    </div>

    <div class="field">
      <label>Notes (optional)</label>
      <input id="notes" />
    </div>

    <button id="save">Save to Notion</button>
    <div id="status-msg"></div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
