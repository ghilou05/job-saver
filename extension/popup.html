<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 280px;
      font-family: sans-serif;
      padding: 12px;
    }

    label {
      display: block;
      font-size: 12px;
      margin-top: 8px;
    }

    input,
    select {
      width: 100%;
      padding: 6px;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <div class="heading-text">
      <h3>Job Saver</h3>
      <p>Save this job</p>
    </div>
    
    <div class="database-selection">
      <label>Save to</label>
      <div id="destinations"></div>
    </div>



    <label>Job title</label>
    <input id="jobTitle" />

    <label>Company</label>
    <input id="company" />

    <label>Link</label>
    <input id="url" />

    <label>Notes (optional)</label>
    <input id="notes" />

    <button id="save">Save to Notion</button>
    <div id="status-msg"></div>
  </div>


  <script src="popup.js"></script>
  <link rel="stylesheet" href="popup.css" />
</body>

</html>
